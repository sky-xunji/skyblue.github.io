<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>光遇景点推荐</title>

  <style>
    :root {
      --primary: #eaeef3;
      --text-main: #1f2a37;
      --text-sub: #6b7280;
      --accent: #c8a97e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }

    body {
      background: #f7f9fc;
      color: var(--text-main);
    }

    /* ===== Header ===== */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 40px;
      z-index: 1000;
    }

    header .logo {
      font-size: 20px;
      font-weight: 600;
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      text-decoration: none;
      color: var(--text-main);
      font-size: 14px;
    }

    /* ===== Hero ===== */
    .hero {
      height: 100vh;
      background: linear-gradient(to top, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0)),
        url("image/SKY001\ \(3\).jpg") center/cover;
      display: flex;
      align-items: center;
      padding: 0 8%;
    }

    .hero-content {
      max-width: 600px;
    }

    .hero h1 {
      font-size: 56px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .hero p {
      color: var(--text-sub);
      margin-bottom: 30px;
    }

    .btn {
      padding: 12px 26px;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: var(--accent);
      color: #fff;
    }

    /* ===== Section ===== */
    .section {
      padding: 100px 8%;
      text-align: center;
    }

    .section h2 {
      font-size: 32px;
      margin-bottom: 60px;
      font-weight: 500;
    }

    /* ===== Cards ===== */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      transition: 0.3s;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-body {
      padding: 20px;
      text-align: left;
    }

    .card-title {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 14px;
      color: var(--text-sub);
    }

    /* ===== Footer ===== */
    footer {
      padding: 60px 8%;
      text-align: center;
      color: var(--text-sub);
      font-size: 14px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 1024px) {
      .card-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero h1 {
        font-size: 42px;
      }
    }

    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
      }

      nav {
        display: none;
      }

      .hero {
        padding: 0 20px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .card-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <div class="logo">Sky · 光遇</div>
    <nav>
      <a href="#">关于</a>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-content">
      <h1>光遇景点推荐</h1>
      <p>好看的不是风景，而是陪你看风景的人。</p>
      <button class="btn">开始探索 →</button>
    </div>
  </section>

  <!-- Section -->
  <section class="section">
    <h2>精选景点</h2>

    <div class="card-grid">

      <div class="card">
        <img src="image/SKY001 (1).jpg">
        <div class="card-body">
          <div class="card-title">晨岛 · 梦幻奇夜</div>
          <div class="card-desc">夏天漫步之夜</div>
        </div>
      </div>

      <div class="card">
        <img src="image/SKY001 (2).jpg">
        <div class="card-body">
          <div class="card-title">云野 · 幸运草海</div>
          <div class="card-desc">风吹草浪之地</div>
        </div>
      </div>

      <div class="card">
        <img src="image/SKY001 (3).jpg">
        <div class="card-body">
          <div class="card-title">雨林 · 观雨台</div>
          <div class="card-desc">聆听静心之频</div>
        </div>
      </div>

      <div class="card">
        <img src="image/SKY001 (4).jpg">
        <div class="card-body">
          <div class="card-title">霞谷 · 落日崖</div>
          <div class="card-desc">夕阳治愈之境</div>
        </div>
      </div>

      <div class="card">
        <img src="image/SKY001 (5).jpg">
        <div class="card-body">
          <div class="card-title">遇境 · 凛冬</div>
          <div class="card-desc">雪下埋藏之事</div>
        </div>
      </div>

      <div class="card">
        <img src="image/SKY001 (6).jpg">
        <div class="card-body">
          <div class="card-title">晨岛 · 流星雨</div>
          <div class="card-desc">愿望许诺之地</div>
        </div>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer>
    光是遇见就很美好！
  </footer>

</body>

</html>
